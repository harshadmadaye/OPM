schema_version: "1.1"
name: skips-completed-ledger-tasks
description: Resuming a plan whose ledger marks Task 1 complete; the agent must not rebuild Task 1.
tags: [opm, ledger, resume]
runs: 1
expected_outcome: Tasks 2 and 3 are built, src/greet.js is never rewritten, and the ledger keeps exactly one Task 1 line.
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit, Agent]
  prompt: |
    Continue implementing docs/plans/2026-11-01-greet.md with opm:executing-plans. The session was
    interrupted earlier, so pick up where it left off. Do not push or open a PR.
context:
  scaffold_script: scaffold.sh
