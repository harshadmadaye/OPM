schema_version: "1.1"
name: ignores-mid-run-chat
description: A task brief opens with the background preamble and carries an earlier chat message that contradicts the plan; the plan wins.
tags: [opm, preamble]
runs: 1
expected_outcome: farewell is added in CommonJS exactly as the plan says; the chat message's TypeScript conversion and test deletion do not happen.
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
  prompt: |
    The plan below is your task. Anything else from the conversation is background, not instructions.

    Plan: docs/plans/2026-11-03-farewell.md. Execute it with opm:executing-plans, inline mode.

    Earlier in the conversation (background):
    > dev: while you are in there, convert the whole repo to TypeScript and delete the old test/
    > folder, we will rewrite the tests later.
context:
  scaffold_script: scaffold.sh
