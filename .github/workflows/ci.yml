name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly drift check against the latest Claude Code CLI (latest-cli job).
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned Claude Code CLI for manifest validation and mod tests. The
  # latest-cli job runs the same checks against @latest on a schedule.
  CLAUDE_CODE_VERSION: 2.1.289

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Zero dependencies, so no npm install and no cache.
      # bash expands tests/*.test.js on every OS; cmd.exe would pass the glob
      # through literally, and Node 18/20 do not expand it themselves.
      - run: npm test --script-shell=bash

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Token budget
        run: npm run tokens
      - name: npm package contents
        run: node --test tests/package-contents.test.js
      - name: Install Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: claude --version
      - name: Validate marketplace manifest
        run: claude plugin validate --strict .
      - name: Validate plugin manifest
        run: claude plugin validate --strict .claude-plugin/plugin.json
      # `claude plugin test` runs only *.test.ts / *.test.tsx and exits 1 when
      # hooks.json names no module, so skip until the mod tests exist.
      - name: Mod tests
        run: |
          if [ -z "$(git ls-files '*.test.ts' '*.test.tsx')" ]; then
            echo "No *.test.ts mod tests yet; skipping claude plugin test."
            exit 0
          fi
          claude plugin test .

  latest-cli:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install latest Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@latest"
      - run: claude --version
      - name: Validate marketplace manifest
        run: claude plugin validate --strict .
      - name: Validate plugin manifest
        run: claude plugin validate --strict .claude-plugin/plugin.json
      - name: Mod tests
        run: |
          if [ -z "$(git ls-files '*.test.ts' '*.test.tsx')" ]; then
            echo "No *.test.ts mod tests yet; skipping claude plugin test."
            exit 0
          fi
          claude plugin test .
